<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:1200px; height:630px; overflow:hidden; }
  body {
    background:#0a0a0a;
    font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    padding:54px 76px 0 76px;
  }
  .eyebrow { display:flex; align-items:center; gap:20px; margin-bottom:46px; }
  .rule { width:72px; height:3px; background:#f97316; flex:none; }
  .label {
    color:#f97316; font-size:17px; font-weight:700;
    letter-spacing:.22em; text-transform:uppercase; white-space:nowrap;
  }
  .card {
    display:flex; align-items:center;
    height:192px; border-radius:18px; padding:0 40px;
    background:#141414; border:1px solid rgba(255,255,255,.07);
  }
  .card + .card { margin-top:28px; }
  .card.accent { background:#1e1008; border:1px solid #f97316; }
  .num {
    width:96px; flex:none;
    color:#f97316; font-size:27px; font-weight:700; letter-spacing:.02em;
  }
  .body { flex:1; }
  .name {
    color:#ffffff; font-size:46px; font-weight:700;
    letter-spacing:-.02em; line-height:1.1; margin-bottom:12px;
  }
  .card.accent .name { color:#f97316; }
  .sub { color:#a3a3a3; font-size:23px; font-weight:400; line-height:1.35; }
</style></head>
<body>
  <div class="eyebrow"><span class="rule"></span><span class="label">DOS PRODUCTOS &middot; EN ESTE ORDEN</span></div>
  <div class="card">
    <div class="num">01</div>
    <div class="body"><div class="name">Findability Report</div><div class="sub">D&oacute;nde est&aacute;s parado. Entrega en 5 a 7 d&iacute;as.</div></div>
  </div>
  <div class="card accent">
    <div class="num">02</div>
    <div class="body"><div class="name">Doble Presence</div><div class="sub">El mes que sigue. La IA va adentro.</div></div>
  </div>
</body></html>
