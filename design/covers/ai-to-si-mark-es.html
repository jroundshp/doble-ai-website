<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden;font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
  .l,.r{position:absolute;top:0;bottom:0;width:600px;display:flex;align-items:center;justify-content:center}
  .l{left:0;background:#0a0a0a}
  .r{right:0;background:#f97316}
  .t{font-size:260px;font-weight:900;letter-spacing:-.04em;line-height:1}
  .l .t{color:#6b6b6b;margin-right:120px}
  .r .t{color:#0a0a0a;margin-left:120px}
  .arrow{position:absolute;left:420px;top:315px;width:330px;height:14px;margin-top:-7px;background:#fff}
  .head{position:absolute;left:744px;top:315px;margin-top:-30px;width:0;height:0;border-top:30px solid transparent;border-bottom:30px solid transparent;border-left:48px solid #fff}
  .foot{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:space-between;padding:0 48px;font-size:18px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
  .foot span:first-child{color:#6b6b6b}.foot span:last-child{color:#0a0a0a}
</style></head><body>
  <div class="l"><div class="t">IA</div></div>
  <div class="r"><div class="t">SI</div></div>
  <div class="arrow"></div><div class="head"></div>
  <div class="foot"><span>Doble AI</span><span>dobleai.com/es</span></div>
</body></html>
