<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1080px;overflow:hidden;font-family:"Inter",sans-serif;-webkit-font-smoothing:antialiased}
  .l,.r{position:absolute;left:0;right:0;height:540px;display:flex;align-items:center;justify-content:center}
  .l{top:0;background:#0a0a0a}
  .r{bottom:0;background:#f97316}
  .t{font-size:260px;font-weight:900;letter-spacing:-.04em;line-height:1}
  .l .t{color:#6b6b6b;margin-bottom:60px}
  .r .t{color:#0a0a0a;margin-top:60px}
  .arrow{position:absolute;left:533px;top:400px;width:14px;height:250px;background:#fff}
  .head{position:absolute;left:510px;top:648px;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:48px solid #fff}
  .foot{position:absolute;left:0;right:0;bottom:34px;display:flex;justify-content:flex-end;padding:0 48px;font-size:18px;font-weight:500;letter-spacing:.18em;text-transform:uppercase}
  .foot span:first-child{position:absolute;left:48px;top:-1008px;color:#6b6b6b}.foot span:last-child{color:#0a0a0a}
</style></head><body>
  <div class="l"><div class="t">IA</div></div>
  <div class="r"><div class="t">SI</div></div>
  <div class="arrow"></div><div class="head"></div>
  <div class="foot"><span>Doble AI</span><span>dobleai.com/es</span></div>
</body></html>
